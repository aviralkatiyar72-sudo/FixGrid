<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixGrid Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .signup-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <h1>FixGrid</h1>
    <h2>Create Account</h2>

    <form id="signupForm">

        <label for="name">Company / Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="WebCraft Market"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="company@example.com"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="At least 6 characters"
            minlength="6"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            minlength="6"
            required
        >

        <button type="submit">Create Account</button>

    </form>

    <p id="message"></p>

</div>

<script>

document.getElementById("signupForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");


        // Check password
        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match!";

            return;
        }


        try {

            const response = await fetch("/api/signup", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,
                    email: email,
                    password: password

                })

            });


            const result = await response.json();


            if (!result.success) {

                message.textContent =
                    result.message;

                return;
            }


            // Save user for FixGrid Home page
            const user = {
                name: name,
                email: email
            };

            localStorage.setItem(
                "fixgrid_user",
                JSON.stringify(user)
            );


            // Add company to FixGrid company list
            let companies =
                JSON.parse(
                    localStorage.getItem("fixgrid_companies")
                ) || [];


            const alreadyExists = companies.some(
                company =>
                    company.name.toLowerCase() ===
                    name.toLowerCase()
            );


            if (!alreadyExists) {

                companies.push({
                    name: name
                });

                localStorage.setItem(
                    "fixgrid_companies",
                    JSON.stringify(companies)
                );
            }


            message.textContent =
                "Account created successfully!";


            // Go to FixGrid Home
            setTimeout(function() {

                window.location.href = "/";

            }, 1000);


        } catch (error) {

            message.textContent =
                "Unable to connect to FixGrid server.";

            console.error(error);

        }

    }

);

</script>

</body>
</html>
